    <title>Telemetry - Satellite Monitoring System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>🛰️ Satellite Monitor</h2>

        <div>
            <a href="index.html">Dashboard</a>
            <a href="satellites.html">Satellites</a>

    <main>

        <h1>Telemetry</h1>
        <p>Satellite health and telemetry information</p>

        <div class="info-grid">

            <div class="info-card">
                <h4>🔋 Battery</h4>
                <p>87%</p>
            </div>

            <div class="info-card">
                <h4>🌡️ Temperature</h4>

            </div>

            <div class="info-card">
                <h4>📡 Signal</h4>
                <p>GOOD</p>

            <div class="info-card">
                <h4>🟢 Health Status</h4>
                <p>NORMAL</p>
            </div>

            <div class="info-card">
                <h4>🛰️ Satellite</h4>
                <p>SAT-01</p>
            </div>

            <div class="info-card">
                <h4>⏱️ Last Update</h4>
                <p>17:30:25</p>
            </div>

        </div>
